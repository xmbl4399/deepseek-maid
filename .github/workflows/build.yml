name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # 手动触发兜底:tag 与 main 指向同一 commit 时,GH 可能只对 branch 生成 run,
  # 此时从 Actions 页手动触发并勾选 release 即可构建发布
  workflow_dispatch:
    inputs:
      release:
        description: '构建并发布 Release(需已打 v* tag)'
        type: boolean
        default: false

# 新仓库默认 GITHUB_TOKEN 为只读,创建/上传 GitHub Release 必须显式声明写权限
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint

  build-win:
    # 仅打 tag 时构建安装包并发到 GitHub Release(或手动触发)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --publish never:避免 electron-builder 见到 GH_TOKEN+publish 配置后自行尝试发 GitHub Release 导致失败
      # (发版统一由下方 action-gh-release 完成)
      - run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap

  build-linux:
    # 触发条件比 build-win 宽一档:手动 workflow_dispatch 也跑(即使不发布 Release)。
    # 原因:deb/AppImage 无法在 Windows 上产出(fpm 是 Linux 可执行文件),想在本地验证
    # 只能借 CI 的 ubuntu runner;这类"只验证不发布"的构建走 artifact 下载即可。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # deb 由 electron-builder 内置的 fpm 产出(首次运行会下载一个 AppImage 形式的 ruby
      # 运行时并缓存到 ~/.cache/electron-builder);fpm 调用 dpkg-deb/fakeroot/xz,
      # ubuntu-latest 默认只有 dpkg,另两个要自己装。
      - name: 准备 deb 打包工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg xz-utils

      - name: 构建 deb + AppImage
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 产物自检:绿了但没货是最坏的失败方式,所以在发布前就把"有没有包、包结构对不对"钉死。
      # dpkg-deb -I 能跑通说明 control 段(包名/版本/架构/依赖)是合法的 Debian 元数据。
      - name: 校验产物
        run: |
          ls -lh release/
          test -n "$(ls release/*.deb 2>/dev/null)" || { echo "::error::没有产出 .deb"; exit 1; }
          test -n "$(ls release/*.AppImage 2>/dev/null)" || { echo "::error::没有产出 .AppImage"; exit 1; }
          for d in release/*.deb; do
            echo "===== $d ====="
            dpkg-deb -I "$d"
            echo "----- 关键文件 -----"
            dpkg-deb -c "$d" | grep -E 'deepseek-desktop$|\.desktop$|icons/.*512x512|app\.asar$' || true
          done

      # 不发布 Release 时(纯手动验证),把包作为 workflow artifact 留下,可直接下载安装
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-desktop-linux
          path: |
            release/*.deb
            release/*.AppImage
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.deb
            release/*.AppImage
            release/latest-linux.yml
